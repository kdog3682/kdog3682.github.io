name: Deploy

on:
  push:
    branches: [main]
  schedule:
    # daily rebuild so worksheet changes in Google Drive show up
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DRIVE_WORKSHEETS_FOLDER_ID: ${{ secrets.DRIVE_WORKSHEETS_FOLDER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
        with:
          package-manager: bun@latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
